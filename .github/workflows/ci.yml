name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t epiinfer:ci .
      - run: docker run --rm epiinfer:ci --version
      - name: smoke test on the bundled demo data
        run: |
          docker run --rm epiinfer:ci demo
          docker run --rm epiinfer:ci forecast --data "$(docker run --rm epiinfer:ci demo)" --horizon 3 --num-sims 3
