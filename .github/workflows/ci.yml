name: ci
on: [push, pull_request]
env:
  UV_VERSION: "0.12.22"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                    # one failing Python must not hide the others
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}     # `uv run` re-syncs; keep it on the matrix Python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv lock --check                       # uv.lock must match pyproject.toml
      - run: uv run --locked --all-extras python -c "import sys; print(sys.version)"
      - run: uv run --locked --all-extras ruff check .
      - run: uv run --locked --all-extras pytest -q
      - run: uv run --locked --all-extras python tools/mutation_check.py
        if: matrix.python == '3.13'
      - run: uv run --locked --all-extras cffconvert --validate -i CITATION.cff
        if: matrix.python == '3.13'
      - run: uv build
        if: matrix.python == '3.13'
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uvx --from actionlint-py actionlint
  base-install:
    # no optional extras: plotting/baseline tests must skip, everything else must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv run --locked pytest -q
  lowest-deps:
    # the declared floors (numpy 1.26, pandas 2.0, statsmodels 0.14, scipy 1.16, ...) must work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: >
          uv run --isolated --no-project --python 3.11 --resolution lowest-direct
          --with-editable ".[all]" --with "pytest==8.0.0" pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f docker/Dockerfile -t epiinfer:ci .
      - run: docker run --rm epiinfer:ci --version
      - name: smoke test on the bundled demo data, as an arbitrary non-root uid
        run: |
          mkdir -p results
          DEMO="$(docker run --rm epiinfer:ci demo)"
          docker run --rm epiinfer:ci forecast --data "$DEMO" --horizon 3 --num-sims 3
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/results:/work/results" \
            epiinfer:ci run --data "$DEMO" --method empirical_p1 --start-eval 40 --num-sims 2 --plots
          ls results/summary_demo_data_empirical_p1.csv results/forecast_demo_data_empirical_p1.png
      - name: docker/run_all.sh end to end (demo steps; paper tables skipped, no data here)
        run: DATA="$PWD/data-ci" OUT="$PWD/results-ci" docker/run_all.sh
  tutorial:
    # docs/TUTORIAL.md, run inside the Docker image: its outputs must equal the committed ones
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}" }
      - run: docker build -f docker/Dockerfile -t epiinfer:ci .
      - name: run every tutorial command in the container
        run: IMAGE=epiinfer:ci WORK="$PWD/tutorial-work" docs/tutorial/run_tutorial.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tutorial-results, path: tutorial-work/results }
      - name: outputs equal docs/tutorial/outputs
        run: uv run --locked --no-dev python tools/compare_tutorial.py tutorial-work/results docs/tutorial/outputs
