name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python tools/mutation_check.py
        if: matrix.python == '3.13'
  lowest-deps:
    # the declared floors (numpy 1.24, pandas 2.0, ...) must actually work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.10 && uv pip install --resolution lowest-direct -e ".[all]" "pytest==8.0.0"
      - run: .venv/bin/python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t epiinfer:ci .
      - run: docker run --rm epiinfer:ci --version
      - name: smoke test on the bundled demo data, as an arbitrary non-root uid
        run: |
          mkdir -p results
          DEMO="$(docker run --rm epiinfer:ci demo)"
          docker run --rm epiinfer:ci forecast --data "$DEMO" --horizon 3 --num-sims 3
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/results:/work/results" \
            epiinfer:ci run --data "$DEMO" --method empirical_p1 --start-eval 40 --num-sims 2 --plots
          ls results/summary_demo_data_empirical_p1.csv results/forecast_demo_data_empirical_p1.png
