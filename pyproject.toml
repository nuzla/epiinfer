[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epiinfer"
version = "0.2.1"
description = "EpiInfer-CONTACT: forecasting infection counts in epidemics from contact-tracing data (reproduction code for the Algorithms 2025 paper)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jovan Kascelan" }, { name = "Ruoxi Yang" }, { name = "Dennis Shasha" }]
# Floors are the oldest versions tested (CI job `lowest-deps`, Python 3.11).
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
# scipy is only a transitive dependency of statsmodels; builds older than 1.16 fail to load
# on current macOS (dlopen "__thread_bss" error), so the floor is pinned here.
baselines = ["statsmodels>=0.14", "scipy>=1.16"]
all = ["epiinfer[plots,baselines]"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "cffconvert>=2.0", "pyyaml>=6.0"]

[project.scripts]
epiinfer = "epiinfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epiinfer"]

[tool.hatch.build.targets.sdist]
# everything needed to run the test suite from the sdist alone (CI runs it from the sdist:
# tests/test_docker_files.py reads docker/ and .github/)
include = ["src/epiinfer", "tests", "tools", "examples", "docs", "docker", ".github", "README.md",
           "LICENSE", "CHANGELOG.md", "CITATION.cff", "pyproject.toml", "uv.lock", ".python-version"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B905"]   # S/A/I/R compartment names; zip lengths are equal by construction

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["paper: needs the paper datasets (EPIINFER_PAPER_DATA)"]
